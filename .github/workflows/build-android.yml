name: Build Writing Test Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "tools/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Rebuild and verify Writing Test v2.1 HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          source = Path("app/src/main/assets/chunks")
          parts = sorted(source.glob("part*.htmlpart"))
          assert len(parts) == 13, f"Expected 13 parts, got {len(parts)}"
          content = b"\xef\xbb\xbf" + b"\n".join(p.read_bytes() for p in parts)
          actual = hashlib.sha256(content).hexdigest()
          expected = "c245aabc8706e9ec85c16f4795b1f1d06c4dfa077c37be16d5d3034c31d8b79a"
          assert actual == expected, f"Source SHA-256 mismatch: {actual}"
          target = Path("app/src/main/assets/writing_test_android.html")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(content)
          print("Verified original Writing Test v2.1 HTML:", len(content), "bytes")
          PY
          python3 tools/patch_android_html.py
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html = Path("app/src/main/assets/writing_test_android.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, flags=re.I|re.S)
          assert len(scripts) == 3, f"Expected 3 inline scripts, got {len(scripts)}"
          for n, code in enumerate(scripts):
              out = Path(f"/tmp/writing_test_check_{n}.js")
              out.write_text(code, encoding="utf-8")
              subprocess.check_call(["node", "--check", str(out)])
          print("All Writing Test JavaScript blocks pass syntax check.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preserve debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: writing-test-debug-keystore-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Writing_Test_v1_0_0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Writing_Test_v1_0_0_APK
          path: dist/Writing_Test_v1_0_0.apk
          if-no-files-found: error
          retention-days: 30
